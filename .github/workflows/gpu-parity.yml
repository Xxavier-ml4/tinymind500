name: gpu-parity
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev]"
      - name: Parity gate (NumPy oracle vs torch mirror)
        run: python -m tinymind_gpu.parity --json parity_report.json
      - name: S0 contract + v3 policy tests
        run: pytest tests/upgrade -v
      - uses: actions/upload-artifact@v4
        with: {name: parity-report, path: parity_report.json}
